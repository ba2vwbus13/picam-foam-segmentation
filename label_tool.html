<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魚群ラベル修正</title>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#deded8; --accent:#2f6fde; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --panel:#20201e; --ink:#ecece8; --muted:#9a9a94; --line:#34342f; --accent:#6d9cf0; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system, "Hiragino Sans", sans-serif; }
  .app { display:grid; grid-template-columns: 220px 1fr; height:100vh; }
  aside { border-right:1px solid var(--line); background:var(--panel); overflow:auto; padding:12px; }
  aside h1 { font-size:15px; margin:0 0 4px; }
  aside .count { color:var(--muted); font-size:12px; margin-bottom:8px; }
  .item { display:flex; gap:6px; align-items:center; padding:4px 6px; border-radius:6px; cursor:pointer;
          font-variant-numeric: tabular-nums; font-size:12.5px; }
  .item:hover { background:var(--bg); }
  .item.cur { background:var(--accent); color:#fff; }
  .item .dot { width:8px; height:8px; border-radius:50%; border:1.5px solid currentColor; flex:none; }
  .item.done .dot { background:currentColor; }
  main { display:flex; flex-direction:column; min-width:0; }
  .bar { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:8px 12px;
         border-bottom:1px solid var(--line); background:var(--panel); }
  .cls { display:flex; gap:4px; }
  .cls button { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:6px;
                padding:4px 10px; cursor:pointer; font:inherit; display:flex; gap:6px; align-items:center; }
  .cls button.on { outline:2px solid var(--accent); outline-offset:1px; }
  .sw { width:12px; height:12px; border-radius:3px; display:inline-block; }
  .bar label { display:flex; gap:6px; align-items:center; color:var(--muted); }
  .bar .act button { border:0; background:var(--accent); color:#fff; border-radius:6px; padding:5px 12px; cursor:pointer; font:inherit; }
  .bar .act button.sec { background:var(--bg); color:var(--ink); border:1px solid var(--line); }
  .status { margin-left:auto; color:var(--muted); font-size:12.5px; }
  .stage { flex:1; overflow:auto; padding:10px; }
  .wrap { position:relative; width:100%; max-width:1280px; margin:0 auto; cursor:none; }
  .wrap canvas { position:absolute; inset:0; width:100%; height:100%; }
  .wrap canvas:first-child { position:relative; display:block; height:auto; }
  .help { color:var(--muted); font-size:12px; padding:6px 12px 10px; }
  kbd { border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 4px; font-size:11px; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>魚群ラベル修正</h1>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </aside>
  <main>
    <div class="bar">
      <div class="cls" id="cls"></div>
      <label>ブラシ <input type="range" id="size" min="4" max="120" value="30"> <span id="sizev">30</span></label>
      <label>重ね <input type="range" id="alpha" min="0" max="100" value="45"></label>
      <label><input type="checkbox" id="protect" checked> 水面の外は塗らない</label>
      <div class="act"><button class="sec" id="undo">元に戻す</button> <button id="save">保存</button></div>
      <span class="status" id="status"></span>
    </div>
    <div class="stage">
      <div class="wrap" id="wrap">
        <canvas id="img"></canvas><canvas id="ov"></canvas><canvas id="cur"></canvas>
      </div>
    </div>
    <div class="help">
      「水面に映る黒い部分」を魚群として塗ってください。
      <kbd>1</kbd>水面外 <kbd>2</kbd>水 <kbd>3</kbd>泡 <kbd>4</kbd>魚群 ・
      <kbd>[</kbd><kbd>]</kbd>ブラシの大きさ ・ <kbd>H</kbd>押している間ラベルを隠す ・
      <kbd>⌘Z</kbd>元に戻す ・ <kbd>S</kbd>保存 ・ <kbd>←</kbd><kbd>→</kbd>前後の画像 (変更は自動保存)
    </div>
  </main>
</div>
<script>
const CLASSES = [
  {name:"水面外", color:[0,0,0,0], sw:"transparent"},
  {name:"水", color:[0,200,255], sw:"rgb(0,200,255)"},
  {name:"泡", color:[255,0,255], sw:"rgb(255,0,255)"},
  {name:"魚群", color:[0,230,60], sw:"rgb(0,230,60)"},
];
const $ = id => document.getElementById(id);
const imgC = $("img"), ovC = $("ov"), curC = $("cur");
const ictx = imgC.getContext("2d"), octx = ovC.getContext("2d"), cctx = curC.getContext("2d");
let W = 1280, H = 720, mask = null, items = [], idx = 0, cls = 3, dirty = false, undo = [], painting = false, last = null;
let hideOv = false;

CLASSES.forEach((c, i) => {
  const b = document.createElement("button");
  b.innerHTML = `<span class="sw" style="background:${c.sw};border:1px solid var(--line)"></span>${i+1} ${c.name}`;
  b.onclick = () => setCls(i);
  $("cls").appendChild(b);
});
function setCls(i) { cls = i; [...$("cls").children].forEach((b, j) => b.classList.toggle("on", j === i)); }
setCls(3);

function setStatus(t) { $("status").textContent = t; }

async function loadQueue() {
  items = await (await fetch("/api/queue")).json();
  renderList();
  if (items.length) open(Math.max(0, items.findIndex(x => !x.done)));
}
function renderList() {
  $("count").textContent = `${items.filter(x => x.done).length} / ${items.length} 枚 修正済み`;
  $("list").innerHTML = "";
  items.forEach((it, i) => {
    const d = document.createElement("div");
    d.className = "item" + (it.done ? " done" : "") + (i === idx ? " cur" : "");
    d.innerHTML = `<span class="dot"></span>${it.name.replace("_", " ")}`;
    d.onclick = () => go(i);
    $("list").appendChild(d);
  });
}

function loadImage(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}

async function open(i) {
  idx = i; const name = items[i].name;
  setStatus("読み込み中…");
  const [im, mk] = await Promise.all([loadImage(`/image/${name}?t=${Date.now()}`), loadImage(`/mask/${name}?t=${Date.now()}`)]);
  W = im.naturalWidth; H = im.naturalHeight;
  for (const c of [imgC, ovC, curC]) { c.width = W; c.height = H; }
  ictx.drawImage(im, 0, 0);
  const t = document.createElement("canvas"); t.width = W; t.height = H;
  const tc = t.getContext("2d"); tc.drawImage(mk, 0, 0);
  const d = tc.getImageData(0, 0, W, H).data;
  mask = new Uint8Array(W * H);
  for (let p = 0; p < W * H; p++) mask[p] = Math.min(3, d[p * 4]);
  undo = []; dirty = false;
  drawOverlay(); renderList();
  setStatus(items[i].done ? "修正済みラベルを表示中" : "疑似ラベルを表示中");
}

function drawOverlay(x0 = 0, y0 = 0, x1 = W, y1 = H) {
  x0 = Math.max(0, x0|0); y0 = Math.max(0, y0|0); x1 = Math.min(W, Math.ceil(x1)); y1 = Math.min(H, Math.ceil(y1));
  if (x1 <= x0 || y1 <= y0) return;
  const a = hideOv ? 0 : Math.round($("alpha").value * 2.55);
  const id = octx.createImageData(x1 - x0, y1 - y0), d = id.data;
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const c = mask[y * W + x], o = ((y - y0) * (x1 - x0) + (x - x0)) * 4, col = CLASSES[c].color;
    d[o] = col[0]; d[o+1] = col[1]; d[o+2] = col[2]; d[o+3] = c === 0 ? 0 : a;
  }
  octx.putImageData(id, x0, y0);
}

function pos(e) {
  const r = ovC.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
function stamp(x, y) {
  const rad = +$("size").value / 2, protect = $("protect").checked && cls !== 0;
  const x0 = Math.max(0, Math.floor(x - rad)), x1 = Math.min(W - 1, Math.ceil(x + rad));
  const y0 = Math.max(0, Math.floor(y - rad)), y1 = Math.min(H - 1, Math.ceil(y + rad));
  for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) {
    if ((xx - x) ** 2 + (yy - y) ** 2 > rad * rad) continue;
    const p = yy * W + xx;
    if (protect && mask[p] === 0) continue;
    mask[p] = cls;
  }
  drawOverlay(x0, y0, x1 + 1, y1 + 1);
}
function line(a, b) {
  const step = Math.max(1, +$("size").value / 4), n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step);
  for (let k = 1; k <= n; k++) stamp(a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n);
}
function drawCursor(p) {
  cctx.clearRect(0, 0, W, H);
  if (!p) return;
  const rad = +$("size").value / 2;
  cctx.lineWidth = 3; cctx.strokeStyle = "#000"; cctx.beginPath(); cctx.arc(p[0], p[1], rad, 0, 7); cctx.stroke();
  cctx.lineWidth = 1.5; cctx.strokeStyle = cls === 0 ? "#fff" : CLASSES[cls].sw; cctx.beginPath(); cctx.arc(p[0], p[1], rad, 0, 7); cctx.stroke();
}

const wrap = $("wrap");
wrap.addEventListener("pointerdown", e => {
  if (!mask) return;
  wrap.setPointerCapture(e.pointerId);
  undo.push(mask.slice()); if (undo.length > 30) undo.shift();
  painting = true; last = pos(e); stamp(...last); dirty = true; setStatus("未保存の変更あり");
});
wrap.addEventListener("pointermove", e => {
  const p = pos(e); drawCursor(p);
  if (painting) { line(last, p); last = p; }
});
wrap.addEventListener("pointerup", () => { painting = false; });
wrap.addEventListener("pointerleave", () => drawCursor(null));

$("size").oninput = () => { $("sizev").textContent = $("size").value; };
$("alpha").oninput = () => drawOverlay();
$("undo").onclick = doUndo;
$("save").onclick = save;

function doUndo() { if (undo.length) { mask = undo.pop(); drawOverlay(); dirty = true; setStatus("未保存の変更あり"); } }

async function save() {
  if (!mask) return;
  const t = document.createElement("canvas"); t.width = W; t.height = H;
  const tc = t.getContext("2d"), id = tc.createImageData(W, H), d = id.data;
  for (let p = 0; p < W * H; p++) { d[p*4] = d[p*4+1] = d[p*4+2] = mask[p]; d[p*4+3] = 255; }
  tc.putImageData(id, 0, 0);
  const r = await fetch(`/save/${items[idx].name}`, {method: "POST", body: t.toDataURL("image/png")});
  if (r.ok) { dirty = false; items[idx].done = true; renderList(); setStatus("保存しました"); }
  else setStatus("保存に失敗しました");
}

async function go(i) {
  if (i < 0 || i >= items.length) return;
  if (dirty) await save();
  open(i);
}

addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "checkbox" && e.target.type !== "range") return;
  if ((e.metaKey || e.ctrlKey) && e.key === "z") { e.preventDefault(); return doUndo(); }
  if ("1234".includes(e.key) && e.key.length === 1) setCls(+e.key - 1);
  else if (e.key === "[" || e.key === "]") {
    const s = $("size"); s.value = +s.value + (e.key === "]" ? 6 : -6); s.oninput();
  }
  else if (e.key === "h" || e.key === "H") { if (!hideOv) { hideOv = true; drawOverlay(); } }
  else if (e.key === "s" || e.key === "S") { e.preventDefault(); save(); }
  else if (e.key === "ArrowRight") go(idx + 1);
  else if (e.key === "ArrowLeft") go(idx - 1);
});
addEventListener("keyup", e => { if ((e.key === "h" || e.key === "H") && hideOv) { hideOv = false; drawOverlay(); } });
addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

loadQueue();
</script>
</body>
</html>
